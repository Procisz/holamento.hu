name: Adatfrissites

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Adat letoltese es ellenorzese
        run: |
          curl -sSf --max-time 60 -o fresh.json https://stat.mentok.hu/data.json
          jq -e '
            (.meta.updatedDate | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and
            (.meta.latestMonth | type == "string" and test("^[0-9]{4}-[0-9]{2}$")) and
            (.meta.priorities | type == "array") and
            ((.meta.months // []) | all(type == "string" and test("^[0-9]{4}-[0-9]{2}$"))) and
            ((.meta.monthsFrom2025 // []) | all(type == "string" and test("^[0-9]{4}-[0-9]{2}$"))) and
            (.topic2.byArea | type == "object") and
            (.regioTrend.byRegion | type == "object")
          ' fresh.json > /dev/null

      - name: Valtozas ellenorzese es mentes
        id: diff
        run: |
          if cmp -s fresh.json public/data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            rm fresh.json
          else
            STAMP=$(jq -r '.meta.updatedDate' fresh.json)
            case "$STAMP" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
              *) echo "Ervenytelen updatedDate: $STAMP" >&2; exit 1 ;;
            esac
            TARGET="archive/${STAMP}.json"
            N=2
            while [ -f "$TARGET" ] && ! cmp -s fresh.json "$TARGET"; do
              TARGET="archive/${STAMP}-${N}.json"
              N=$((N + 1))
            done
            cp fresh.json "$TARGET"
            mv fresh.json public/data.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "stamp=${STAMP}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit es push
        if: steps.diff.outputs.changed == 'true'
        env:
          STAMP: ${{ steps.diff.outputs.stamp }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json archive/
          git commit -m "Adatfrissites: $STAMP"
          git pull --rebase origin main
          git push

      - name: Deploy inditasa
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
