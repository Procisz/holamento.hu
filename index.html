<!doctype html>
<html lang="hu">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Hol a mentő?</title>
		<meta
			name="description"
			content="Független dashboard a magyarországi mentő kiérkezési időkről, az Országos Mentőszolgálat nyilvános statisztikái alapján."
		/>
		<meta name="theme-color" content="#c2312b" />
		<link rel="canonical" href="https://holamento.hu/" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Hol a mentő?" />
		<meta property="og:url" content="https://holamento.hu/" />
		<meta property="og:locale" content="hu_HU" />
		<meta property="og:locale:alternate" content="en_GB" />
		<meta property="og:locale:alternate" content="de_DE" />
		<meta
			property="og:title"
			content="Hol a mentő? · mentő kiérkezési idők"
		/>
		<meta
			property="og:description"
			content="Független dashboard a magyarországi mentő kiérkezési időkről, az Országos Mentőszolgálat nyilvános statisztikái alapján."
		/>
		<meta name="twitter:card" content="summary" />
		<link
			rel="icon"
			type="image/svg+xml"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c2312b'/%3E%3Cpath d='M27 15h10v12h12v10H37v12H27V37H15V27h12Z' fill='%23ffffff'/%3E%3C/svg%3E"
		/>
		<script>
			(function () {
				var d = document.documentElement.dataset;
				var get = function (k) {
					try {
						return localStorage.getItem(k);
					} catch (e) {
						return null;
					}
				};
				var mode = get("holamento-theme");
				var dark =
					mode === "light" || mode === "dark"
						? mode === "dark"
						: matchMedia("(prefers-color-scheme: dark)").matches;
				d.theme = dark ? "dark" : "light";
				if (mode !== "light" && mode !== "dark") d.themeAuto = "1";

				var lang = get("holamento-lang");
				if (lang === "hu" || lang === "en" || lang === "de")
					document.documentElement.lang = lang;

				if (get("holamento-range-bar") === "closed") d.rangeBar = "closed";
			})();
		</script>
	</head>
	<body>
		<div id="boot-overlay" class="overlay" hidden>
			<div class="overlay-inner">
				<svg class="coin" viewBox="0 0 96 96" aria-hidden="true">
					<circle cx="48" cy="48" r="44" class="coin-face" />
					<path
						class="coin-cross"
						d="M41 25h14v16h16v14H55v16H41V55H25V41h16Z"
					/>
				</svg>
				<h1 class="overlay-title">Hol a mentő?</h1>
				<div class="stages" id="boot-stages">
					<div class="stage" data-stage="fetch">
						<span class="stage-bar"></span
						><span class="stage-label" data-i18n="boot.fetch"></span
						><span class="stage-extra" id="stage-fetch-extra"></span>
					</div>
					<div class="stage" data-stage="parse">
						<span class="stage-bar"></span
						><span class="stage-label" data-i18n="boot.parse"></span>
					</div>
					<div class="stage" data-stage="compute">
						<span class="stage-bar"></span
						><span class="stage-label" data-i18n="boot.compute"></span>
					</div>
					<div class="stage" data-stage="render">
						<span class="stage-bar"></span
						><span class="stage-label" data-i18n="boot.render"></span>
					</div>
				</div>
				<p class="overlay-quip" id="boot-quip"></p>
				<p class="overlay-error" id="boot-error" hidden></p>
			</div>
		</div>

		<header class="app-header">
			<div class="header-inner">
				<a class="brand" href="#attekintes">
					<span class="brand-mark" id="brand-mark">
						<svg class="brand-coin" viewBox="0 0 96 96" aria-hidden="true">
							<circle cx="48" cy="48" r="44" class="coin-face" />
							<path
								class="coin-cross"
								d="M41 25h14v16h16v14H55v16H41V55H25V41h16Z"
							/>
						</svg>
					</span>
					<span class="brand-name">Hol a mentő?</span>
				</a>
				<nav
					class="tabs"
					role="tablist"
					aria-label="Hol a mentő?"
					id="tab-nav"
				></nav>
				<div class="header-actions">
					<span class="info data-age" id="data-age" hidden></span>
					<button
						class="warn-chip"
						id="warn-chip"
						hidden
						aria-haspopup="true"
						aria-expanded="false"
					></button>
					<span class="info" id="status-pill" hidden></span>
					<span class="info" id="range-note-top" hidden></span>
					<button class="icon-btn" id="refresh-btn">
						<svg class="icon" aria-hidden="true"><use href="#i-refresh" /></svg>
					</button>
					<button
						class="icon-btn"
						id="range-toggle"
						hidden
						aria-expanded="true"
						aria-controls="range-bar"
					></button>
					<button
						class="icon-btn"
						id="theme-btn"
						aria-haspopup="true"
						aria-expanded="false"
					></button>
					<button
						class="icon-btn"
						id="lang-btn"
						aria-haspopup="true"
						aria-expanded="false"
					>
						</button>
					<a class="icon-btn" id="site-link" href="https://stat.mentok.hu/" rel="noopener" target="_blank">
						<svg class="icon" aria-hidden="true"><use href="#i-home" /></svg>
					</a>
					<button
						class="icon-btn"
						id="menu-btn"
						aria-haspopup="true"
						aria-expanded="false"
					>
						<svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
					</button>
				</div>
			</div>
			<div class="range-wrap">
				<div class="range-bar" id="range-bar">
					<svg class="icon" aria-hidden="true"><use href="#i-calendar" /></svg>
					<span class="range-label" id="range-label"></span>
					<input type="month" id="range-from" />
					<span class="range-sep">-</span>
					<input type="month" id="range-to" />
					<span class="range-quicks" id="range-quicks"></span>
					<span class="info" id="range-note" hidden></span>
				</div>
			</div>
			<div class="refresh-bar" id="refresh-bar" hidden></div>
		</header>

		<div class="warn-panel" id="warn-panel" hidden></div>
		<div class="lang-panel popover" id="lang-panel" hidden></div>
		<div class="theme-panel popover" id="theme-panel" hidden></div>
		<div class="menu-panel popover" id="menu-panel" hidden></div>

		<main class="app-main" id="app-main"></main>

		<footer class="app-footer" id="app-footer"></footer>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
